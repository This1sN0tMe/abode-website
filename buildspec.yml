version: 0.2
# Capstone 1 — CodeBuild builds and pushes the product image on every GitHub push.
# Which system owns what is a decision this file records: CodeBuild builds and publishes the image;
# Jenkins orchestrates test -> prod by pulling that same image. Without that split, two orchestrators
# do the same three jobs and the deliverable reads as incoherent.
env:
  variables:
    IMAGE_REPO: docker.io/this1sn0tme/abode-website
  secrets-manager:
    DOCKERHUB_TOKEN: dockerhub/this1sn0tme:token
phases:
  pre_build:
    commands:
      - echo "Logging in to Docker Hub as this1sn0tme"
      - echo "$DOCKERHUB_TOKEN" | docker login -u this1sn0tme --password-stdin
      - IMAGE_TAG=$CODEBUILD_RESOLVED_SOURCE_VERSION
      - echo "Building $IMAGE_REPO:$IMAGE_TAG from commit $IMAGE_TAG on $CODEBUILD_WEBHOOK_HEAD_REF"
  build:
    commands:
      - docker build -t "$IMAGE_REPO:$IMAGE_TAG" -t "$IMAGE_REPO:latest" .
  post_build:
    commands:
      - docker push "$IMAGE_REPO:$IMAGE_TAG"
      # Requirement 3 is branch-conditioned: master goes on to prod, develop stops at test.
      # CODEBUILD_WEBHOOK_HEAD_REF is the ref the push carried, so the decision is made from the event,
      # not from a guess about the default branch.
      - |
        REF="${CODEBUILD_WEBHOOK_HEAD_REF:-refs/heads/develop}"
        echo "push ref: $REF"
        if [ "$REF" = "refs/heads/master" ]; then
          docker tag "$IMAGE_REPO:$IMAGE_TAG" "$IMAGE_REPO:prod"
          docker push "$IMAGE_REPO:prod"
          docker push "$IMAGE_REPO:latest"
          echo "PROMOTED_TO_PROD=yes tag=$IMAGE_TAG"
        else
          echo "PROMOTED_TO_PROD=no ref=$REF — develop builds are test-only"
        fi
      - printf '{"ImageURI":"%s"}' "$IMAGE_REPO:$IMAGE_TAG" > imageDetail.json
      - echo "Pushed $IMAGE_REPO:$IMAGE_TAG"
artifacts:
  files:
    - imageDetail.json
