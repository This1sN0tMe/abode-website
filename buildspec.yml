version: 0.2
# ARCHIVED — DESIGNED, NOT EXECUTED. This file is not evidence.
#
# Capstone 1's requirement 3 ("Code Build should automatically be triggered once commit is made…") is
# implemented as a GitHub push webhook into Jenkins Job1, not with the AWS CodeBuild service. Reasons,
# counted: 0/10 published solutions to this brief use AWS CodeBuild, 10/10 use a Jenkins webhook; the
# original handout writes the requirement as two words, "Code Build"; and requirement 5 makes Jenkins
# ("Job1 : build") the owner of the build stage. See DESIGN.md § "Decision 2026-10-30".
#
# Kept as a design record only: it must never sit under evidence/, carry a grader verdict, or appear in
# a claims table. Reviving it needs a CodeConnections (CodeStar) ARN created in the AWS console.
#
# What it would do if executed: Capstone 1 — CodeBuild builds and pushes the product image on every
# GitHub push, branch-conditioned so master promotes to prod and develop stops at test.
env:
  variables:
    IMAGE_REPO: docker.io/this1sn0tme/abode-website
  secrets-manager:
    DOCKERHUB_TOKEN: dockerhub/this1sn0tme:token
phases:
  pre_build:
    commands:
      - echo "Logging in to Docker Hub as this1sn0tme"
      - echo "$DOCKERHUB_TOKEN" | docker login -u this1sn0tme --password-stdin
      - IMAGE_TAG=$CODEBUILD_RESOLVED_SOURCE_VERSION
      - echo "Building $IMAGE_REPO:$IMAGE_TAG from commit $IMAGE_TAG on $CODEBUILD_WEBHOOK_HEAD_REF"
  build:
    commands:
      - docker build -t "$IMAGE_REPO:$IMAGE_TAG" -t "$IMAGE_REPO:latest" .
  post_build:
    commands:
      - docker push "$IMAGE_REPO:$IMAGE_TAG"
      # Requirement 3 is branch-conditioned: master goes on to prod, develop stops at test.
      # CODEBUILD_WEBHOOK_HEAD_REF is the ref the push carried, so the decision is made from the event,
      # not from a guess about the default branch.
      - |
        REF="${CODEBUILD_WEBHOOK_HEAD_REF:-refs/heads/develop}"
        echo "push ref: $REF"
        if [ "$REF" = "refs/heads/master" ]; then
          docker tag "$IMAGE_REPO:$IMAGE_TAG" "$IMAGE_REPO:prod"
          docker push "$IMAGE_REPO:prod"
          docker push "$IMAGE_REPO:latest"
          echo "PROMOTED_TO_PROD=yes tag=$IMAGE_TAG"
        else
          echo "PROMOTED_TO_PROD=no ref=$REF — develop builds are test-only"
        fi
      - printf '{"ImageURI":"%s"}' "$IMAGE_REPO:$IMAGE_TAG" > imageDetail.json
      - echo "Pushed $IMAGE_REPO:$IMAGE_TAG"
artifacts:
  files:
    - imageDetail.json
