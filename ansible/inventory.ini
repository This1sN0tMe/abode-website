# Capstone 1 — the machines, as the pipeline actually uses them.
#
# Scope note, recorded rather than implied: Capstone 1's brief does not name a worker topology. The
# four-worker architecture (Worker1 Jenkins+Java, Worker2 Docker+K8s, …) is Capstone 2's clause. So the
# machines here are the three this pipeline touches, and requirement 1 ("install the necessary software
# on the machines using a configuration management tool") is demonstrated against exactly those.
#
#   jenkins-master  the controller host — runs Jenkins, builds the image, runs Job1/2/3
#   jenkins-test    the test server  — a separate filesystem and machine to Ansible, reached over docker
#   jenkins-prod    the prod server  — likewise
#
# The agent containers have no sshd, so Ansible reaches them with the docker connection plugin rather
# than pretending an SSH path exists. That is a lab transport, not a claim: the same playbook runs
# unchanged against hosts with a normal ssh connection.

[master]
jenkins-master ansible_connection=local

[servers]
jenkins-test ansible_connection=docker
jenkins-prod ansible_connection=docker

[servers:vars]
ansible_python_interpreter=/usr/bin/python3
# The agent containers run as root and carry no sudo binary; `become` would make the docker transport
# look for one and fail with rc=127. Ansible connects as root, which is the privilege apt needs.
ansible_become=false

[all:vars]
ansible_host_key_checking=False
